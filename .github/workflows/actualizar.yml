name: Actualizar descuentos

# Lee los descuentos de cada banco y guarda los datos en el repositorio.
# Vercel publica la web automáticamente con cada commit en main.

on:
  schedule:
    # Lunes y jueves 10:17 UTC (≈ 7:17 hora de Chile) y el día 1 de cada mes
    - cron: "17 10 * * 1,4"
    - cron: "17 10 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Leer descuentos de cada banco
        # Santander y BancoEstado bloquean a los servidores de GitHub:
        # se actualizan desde un computador personal (scripts/actualizar-local.ps1)
        run: python -m scraper.run --excluir santander,bancoestado
      - name: Actualizar logos
        run: python -m scraper.logos
        continue-on-error: true
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data web/logos
          git diff --cached --quiet || git commit -m "Actualizar descuentos $(date -u +%Y-%m-%d)"
          git push
